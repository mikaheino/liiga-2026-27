<!doctype html><html><head><meta charset='utf-8'><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1b1b1b;
         font-family:"GT America",Arial,Helvetica,sans-serif; color:#FFFFFF; -webkit-font-smoothing:antialiased; }
  .slide { width:1080px; height:1350px; display:flex; flex-direction:column;
           background:#1b1b1b; background-image:linear-gradient(to bottom left, #e3ff87 0%, #5a6830 8%, #1b1b1b 27%); }
  .head { padding:60px 64px 28px; }
  .kicker { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:20px; letter-spacing:4px;
            text-transform:uppercase; color:#e3ff87; margin-bottom:18px; }
  .title { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:78px; line-height:0.95;
           text-transform:uppercase; letter-spacing:-1px; color:#FFFFFF; }
  .rule { height:5px; background:#e3ff87; margin:26px 64px 0; }
  .body { flex:1; padding:26px 64px 0; }
  .foot { padding:20px 64px 42px; font-size:19px; color:#9a9a8f; }

  /* ---- standings ---- */
  .body.standings { display:flex; flex-direction:column; padding-bottom:8px; }
  .body.standings .row { flex:1; padding:0; }
  .row { display:flex; align-items:center; gap:26px;
         border-bottom:1px solid rgba(255,255,255,0.07); }
  .row:last-child { border-bottom:none; }
  .rank { width:96px; font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:68px; text-align:right;
          line-height:1; color:#e3ff87; }
  /* Crest treatment: oversized, desaturated, and clipped down the vertical
     centre so only the left half shows. brightness() is needed because several
     crests are dark-inked and grayscale alone leaves them invisible on black. */
  .chip { width:78px; height:156px; overflow:hidden; flex-shrink:0;
          display:flex; align-items:center; }
  /* Crests are drawn as flat silhouettes in the SAME white as the team name:
     the PNG's alpha channel is used as a mask and filled with one colour, so
     every club renders at identical tone regardless of its original artwork.
     A luminance filter can never do this -- each crest has different base
     brightness, so some always came out lighter than others. */
  .chip img { width:156px; height:156px; max-width:none; object-fit:contain; }
  .name { flex:1; font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:44px; text-transform:uppercase;
          letter-spacing:-0.5px; }
  .pts { text-align:right; }
  .ptsn { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:56px; line-height:1;
          font-variant-numeric:tabular-nums; color:#e3ff87; }
  .ptsl { font-size:19px; color:#9a9a8f; margin-top:8px; }
  .ptsr { font-size:21px; color:#e3ff87; margin-top:5px; opacity:0.85; }

  /* ---- technical slides ---- */
  .step { display:flex; gap:20px; margin-bottom:15px; align-items:flex-start; }
  .num { min-width:48px; height:48px; background:#e3ff87; color:#1b1b1b;
         font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:24px; display:flex;
         align-items:center; justify-content:center; }
  /* DIRECT child only -- inline <b> inside the description must stay inline,
     otherwise every highlighted parameter becomes its own block heading */
  .txt > b { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:26px; display:block; color:#FFFFFF;
             margin-bottom:6px; text-transform:uppercase; letter-spacing:-0.3px; }
  .txt span { font-size:20px; line-height:1.38; color:#FFFFFF; opacity:0.88; }
  .txt span b, .callout span b { color:#e3ff87; opacity:1; }
  .callout { background:rgba(255,255,255,0.07); border-left:8px solid #e3ff87;
             padding:18px 26px; margin-top:4px; }
  .callout > b { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:25px; display:block;
                 margin-bottom:10px; color:#e3ff87; text-transform:uppercase; }
  .callout span { font-size:20px; line-height:1.38; color:#FFFFFF; opacity:0.9; }
  /* ---- award slide ---- */
  .award { display:flex; flex-direction:column; justify-content:space-evenly;
           height:100%; padding-bottom:8px; }
  .aw { display:flex; align-items:center; gap:26px; }
  .aw .chip { width:78px; height:150px; }
  .aw .chip img { width:150px; height:150px; }
  .aw-txt { flex:1; }
  .aw-cat { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:20px; letter-spacing:3px;
            text-transform:uppercase; color:#e3ff87; margin-bottom:9px; }
  .aw-name { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:47px; text-transform:uppercase;
             letter-spacing:-1px; line-height:1; }
  .aw-sub { font-size:22px; color:#9a9a8f; margin-top:11px; }
  .aw-num { font-family:"GT America Expanded","Arial Black",Arial,sans-serif; font-size:52px; color:#e3ff87;
            text-align:right; line-height:1; }
  .aw-unit { font-size:19px; color:#9a9a8f; text-align:right;
             margin-top:9px; }
  .big { font-size:29px; line-height:1.4; color:#FFFFFF; }
  .next { font-size:21px; line-height:1.4; margin-top:16px; color:#FFFFFF;
          opacity:0.8; }
  .next b { color:#e3ff87; opacity:1; }
</style></head><body>
