<!doctype html><html><head><meta charset='utf-8'><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#150f09;
         font-family:"Helvetica Neue",Arial,Helvetica,sans-serif; color:#FFFFFF; -webkit-font-smoothing:antialiased; }
  .slide { width:1080px; height:1350px; display:flex; flex-direction:column;
           background:#150f09; background-image:radial-gradient(120% 85% at 60% 5%, #5a4028 0%, #3a2818 32%, #241a10 58%, #150f09 100%); }
  .head { padding:60px 64px 28px; }
  .kicker { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:19px; letter-spacing:5px;
            text-transform:uppercase; color:#f2ece0; opacity:0.75;
            margin-bottom:16px; font-style:italic; }
  /* Liiga-ilme: vino leveä versaali + kultainen liukuväri tekstin sisällä */
  .title { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:76px; line-height:0.94;
           text-transform:uppercase; letter-spacing:-1.5px; font-style:italic;
           transform:skewX(-6deg); transform-origin:left bottom;
           background:linear-gradient(180deg,#f7e7ad 0%,#d9b654 52%,#a9822c 100%);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           filter:drop-shadow(0 3px 0 rgba(0,0,0,0.35)); }
  .rule { height:4px; margin:26px 64px 0;
          background:linear-gradient(90deg,#d9b654 0%,#a9822c 70%,transparent 100%); }
  .body { flex:1; padding:26px 64px 0; display:flex; flex-direction:column; }
  /* method slide only: pin the two callouts to the bottom of the body */
  .boxes { margin-top:auto; padding-bottom:10px; }
  .foot { padding:20px 64px 42px; font-size:19px; color:#a89880; }

  /* ---- standings ---- */
  .body.standings { display:flex; flex-direction:column; padding-bottom:8px; }
  .body.standings .row { flex:1; padding:0; }
  .row { display:flex; align-items:center; gap:26px;
         border-bottom:1px solid rgba(255,255,255,0.06); }
  .row:last-child { border-bottom:none; }
  .rank { width:104px; font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:52px; line-height:1;
          font-style:italic; color:#150f09; background:#f2ece0;
          padding:14px 0; text-align:center; transform:skewX(-6deg);
          box-shadow:4px 4px 0 rgba(0,0,0,0.35); }
  /* Crest treatment: oversized, desaturated, and clipped down the vertical
     centre so only the left half shows. brightness() is needed because several
     crests are dark-inked and grayscale alone leaves them invisible on black. */
  .chip { width:78px; height:156px; overflow:hidden; flex-shrink:0;
          display:flex; align-items:center; }
  /* Crests are drawn as flat silhouettes in the SAME white as the team name:
     the PNG's alpha channel is used as a mask and filled with one colour, so
     every club renders at identical tone regardless of its original artwork.
     A luminance filter can never do this -- each crest has different base
     brightness, so some always came out lighter than others. */
  .chip img { width:156px; height:156px; max-width:none; object-fit:contain; }
  .name { flex:1; font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:42px; text-transform:uppercase;
          letter-spacing:-0.5px; font-style:italic; }
  .pts { text-align:right; }
  .ptsn { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:54px; line-height:1; font-style:italic;
          font-variant-numeric:tabular-nums; color:#f2ece0; }
  .ptsl { font-size:19px; color:#a89880; margin-top:8px; }
  .ptsr { font-size:21px; color:#d9b654; margin-top:5px; opacity:0.85; }

  /* ---- technical slides ---- */
  .step { display:flex; gap:18px; margin-bottom:11px; align-items:flex-start; }
  .num { min-width:42px; height:42px; background:#f2ece0; color:#150f09;
         font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:21px; display:flex;
         align-items:center; justify-content:center; }
  /* DIRECT child only -- inline <b> inside the description must stay inline,
     otherwise every highlighted parameter becomes its own block heading */
  .txt > b { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:23px; display:block; color:#FFFFFF;
             margin-bottom:4px; text-transform:uppercase; letter-spacing:-0.3px; }
  .txt span { font-size:18px; line-height:1.34; color:#FFFFFF; opacity:0.88; }
  .txt span b, .callout span b { color:#d9b654; opacity:1; }
  .callout { background:rgba(255,255,255,0.06); border-left:8px solid #d9b654;
             padding:14px 22px; margin-top:2px; }
  .callout > b { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:22px; display:block;
                 margin-bottom:7px; color:#d9b654; text-transform:uppercase; }
  .callout span { font-size:18px; line-height:1.34; color:#FFFFFF; opacity:0.9; }
  /* Circular avatar used on the player slides: a headshot fills it, a crest
     is letterboxed inside it. Faces are NOT half-clipped like the standings
     crests -- half a face reads as a mistake. */
  .ava { width:112px; height:112px; border-radius:50%; overflow:hidden;
         flex-shrink:0; background:rgba(255,255,255,0.06);
         display:flex; align-items:center; justify-content:center; }
  .ava .face { width:112px; height:112px; object-fit:cover; }
  .ava .crest { width:78px; height:78px; object-fit:contain; }

  /* ---- newcomers slide ---- */
  .body.newcomers { display:flex; flex-direction:column; padding-bottom:8px; }
  .body.newcomers .row { flex:1; padding:0; }
  .pos { width:46px; height:46px; background:#f2ece0; color:#150f09;
         font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:22px; display:flex; align-items:center;
         justify-content:center; flex-shrink:0; }
  .nc-txt { flex:1; }
  .nc-name { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:42px; text-transform:uppercase;
             letter-spacing:-0.5px; line-height:1; font-style:italic; }
  .nc-from { font-size:21px; color:#a89880; margin-top:10px; }
  .nc-num { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:42px; color:#d9b654;
            text-align:right; line-height:1; }
  .nc-unit { font-size:17px; color:#a89880; text-align:right; margin-top:7px; }

  /* ---- award slide ---- */
  .award { display:flex; flex-direction:column; justify-content:space-evenly;
           height:100%; padding-bottom:8px; }
  .aw { display:flex; align-items:center; gap:26px; }
  .aw .ava { width:132px; height:132px; }
  .aw .ava .face { width:132px; height:132px; }
  .aw .ava .crest { width:92px; height:92px; }
  .aw-txt { flex:1; }
  .aw-cat { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:20px; letter-spacing:3px;
            text-transform:uppercase; color:#d9b654; margin-bottom:9px; }
  .aw-name { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:45px; text-transform:uppercase;
             letter-spacing:-1px; line-height:1; font-style:italic; }
  .aw-sub { font-size:22px; color:#a89880; margin-top:11px; }
  .aw-num { font-family:"Arial Black","Helvetica Neue",Arial,sans-serif; font-size:52px; color:#d9b654;
            text-align:right; line-height:1; }
  .aw-unit { font-size:19px; color:#a89880; text-align:right;
             margin-top:9px; }
  .big { font-size:29px; line-height:1.4; color:#FFFFFF; }
  .next { font-size:18px; line-height:1.38; margin-top:12px; color:#FFFFFF;
          opacity:0.8; }
  .next b { color:#d9b654; opacity:1; }
</style></head><body>
