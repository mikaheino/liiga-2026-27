[project]
name = "liiga-predict"
version = "0.1.0"
description = "Predict Liiga 2026-27 final standings from player goal production"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.optional-dependencies]
# Production backend. Install with: pip install -e ".[snowflake]"
# secure-local-storage adds keyring, which caches the OAuth token so the
# connector does not open a browser on every run (see AGENTS.md).
snowflake = [
    "snowflake-connector-python[pandas,secure-local-storage]>=3.7",
    "pyarrow>=14",
]
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff==0.17.1", "radon==6.0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# --- Koodin laatu (2026-10-16): sama tarkistus CI:ssä ja paikallisesti -------
# Aja: python scripts/dev/quality.py   (ruff + monimutkaisuus + testit/kattavuus)
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "*.ipynb", "site", "site_instagram", "data", "logs", "fantasy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: 879 pitkää riviä -- siivotaan erikseen, ei estä putkea vielä (backlog 4).
# B905: zip() ilman strict= -- tyyliasia, ei bugi.
# E731: lambda-sijoitus -- tyyliasia.
ignore = ["E501", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
# Skriptit lisäävät sys.pathin ennen omia importtejaan (ajetaan suoraan, ei pakettina).
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["liiga"]
