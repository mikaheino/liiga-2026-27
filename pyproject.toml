[project]
name = "liiga-predict"
version = "0.1.0"
description = "Predict Liiga 2026-27 final standings from player goal production"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.optional-dependencies]
# Production backend. Install with: pip install -e ".[snowflake]"
# secure-local-storage adds keyring, which caches the OAuth token so the
# connector does not open a browser on every run (see AGENTS.md).
snowflake = [
    "snowflake-connector-python[pandas,secure-local-storage]>=3.7",
    "pyarrow>=14",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
