# Sovelluksen OK-nappi (27.10.; docs/uutismalli_suunnitelma.md): kirjaa
# poissaolon tai paluun omaksi tiedostokseen news-data/absences/ ja käynnistää
# uudelleenlaskennan (recompute.yml). Ei jonoa: jokainen painallus kirjataan,
# vaikka niitä tulisi monta peräkkäin (GitHubin jono pitäisi vain yhden
# odottavan ajon ja peruisi muut). Laskenta ryhmittyy recompute.yml:ssä.
# Käynnistyy käyttäjän tokenilla (fine-grained, tämä repo, Actions: write).
# Syöte ympäristömuuttujina, approve.py hylkää kaiken, mikä ei ole rosterissa.
name: absence

on:
  workflow_dispatch:
    inputs:
      url:
        description: Uutisen osoite (news_items.csv); tyhjä = ilman uutista
        required: false
        default: ""
      player:
        description: Pelaaja rosterista (ohituksessa voi olla tyhjä)
        required: false
        default: ""
      team:
        description: Joukkue
        required: false
        default: ""
      kind:
        description: out = poissa, back = palaa, dismiss = uutinen ohitettu (EI OK)
        required: true
        type: choice
        options: [out, back, dismiss]
      duration:
        description: Kesto, esim. 6ott, 3vko, 2kk tai kausi (out); approve.py validoi
        required: false
        default: "1ott"

permissions:
  contents: write
  actions: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Riippuvuudet
        run: pip install -q -e .
      - name: Kirjaus
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          NEWS_URL: ${{ inputs.url }}
          PLAYER: ${{ inputs.player }}
          TEAM: ${{ inputs.team }}
          KIND: ${{ inputs.kind }}
          DURATION: ${{ inputs.duration }}
        run: |
          git clone -q --branch news-data "$URL" .news-data
          python scripts/news/approve.py .news-data | tee -a "$GITHUB_STEP_SUMMARY"
          cd .news-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "OK: ${PLAYER:-uutinen} ($KIND)"
          ../.github/scripts/push-retry.sh news-data
      - name: Uudelleenlaskenta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recompute.yml --repo "${{ github.repository }}"
