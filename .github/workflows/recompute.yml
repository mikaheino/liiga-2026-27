# Haastajan uudelleenlaskenta (27.10.): automaattiset kirjaukset (auto_absences.py),
# päivän otteluiden haastajaennuste (challenger.py -> news-data) ja sivun julkaisu, jossa kausiennuste
# (pages.yml: challenger_season.py). Käynnistyy OK-painalluksista (absence.yml)
# ja klo 14 -ajosta (news.yml).
# 22.11.2026: lopuksi uutistaulut Snowflakeen (publish_news.py), ennen Macin aamusynkka.
#
# Ryhmittely: jonossa on yksi ajo käynnissä ja yksi odottamassa; uusi pyyntö
# korvaa odottavan. Viisi OK:ta peräkkäin -> enintään kaksi laskentaa, ja
# viimeinen lukee kaikki kirjaukset (ne ovat jo tallessa news-datassa).
name: recompute

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recompute
  cancel-in-progress: false

env:
  LIIGA_SNOW_CONNECTION: ci
  LIIGA_SNOW_ROLE: LIIGA_DEPLOYER
  LIIGA_SNOW_WAREHOUSE: LIIGA_WH
  SNOWFLAKE_ACCOUNT: FUTURICEPARTNER-FUTURICEPARTNER
  SNOWFLAKE_USER: LIIGA_CI

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Riippuvuudet
        run: pip install -q -e .
      - name: Päivän haastaja
        id: haastaja
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git clone -q --branch news-data "$URL" .news-data
          git clone -q --depth 1 --branch pages-data "$URL" .pages-data
          # Yksiselitteiset uutiset kirjataan itse (auto_absences.py), sitten päivän haastaja.
          python scripts/news/auto_absences.py .news-data | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/news/challenger.py .news-data .pages-data | tee -a "$GITHUB_STEP_SUMMARY"
          cd .news-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Haastaja $(TZ=Europe/Helsinki date +%F\ %H:%M)" || { echo "ei muutoksia"; exit 0; }
          ../.github/scripts/push-retry.sh news-data
      # Uutistaulut Snowflakeen (22.11.2026): samat vaiheet kuin Macin news_pull.py (load_news ->
      # news_signals), sitten DELETE + INSERT yhdessä transaktiossa. Sovellus lukee LIIGA.MODELista.
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      - name: Uutistaulut Snowflakeen
        env:
          LIIGA_NEWS_DUCKDB: ${{ runner.temp }}/news.duckdb
        run: |
          set -euo pipefail
          python scripts/news/load_news.py .news-data
          python scripts/news/news_signals.py | tee -a "$GITHUB_STEP_SUMMARY"
          # Rooli LIIGA_NEWS_PUBLISHER, sidotut arvot, yksi transaktio; kaatuu, jos rivit tyhjenisivät
          # tai putoaisivat alle puoleen (23.11.2026, katselmointi M3).
          python scripts/news/publish_news.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sivu (kausiennuste mukaan)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" -f history=false
      - name: Ennuste myöhästyi
        # challenger.py ennustaa vain alkamattomat ottelut. Jos ajo tuli ottelun alun
        # jälkeen, se ei voi tehdä mitään -- ajo kaadetaan, jotta se näkyy (13.11.).
        if: steps.haastaja.outputs.missed == '1'
        run: echo "Haastajan ennuste jäi tekemättä jo alkaneille otteluille" && exit 1
