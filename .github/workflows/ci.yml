# Testit jokaiselle pull requestille ja main-haaran pushille.
# Ei Snowflake-yhteyttä: nämä ajetaan myös ilman salaisuuksia.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Riippuvuudet
        run: pip install -e ".[dev]"
      - name: Koodin laatu (ruff, monimutkaisuus, testit + kattavuus)
        # Sama komento kuin paikallisesti ja git pre-push -hookissa; asetukset
        # pyproject.toml:ssa, lähtötaso scripts/dev/quality_baseline.json.
        run: python scripts/dev/quality.py
      - name: Skriptit kääntyvät
        run: python -m py_compile scripts/*/*.py snowflake/LIIGA/CODE/stages/AGENT_SKILLS/*/render.py snowflake/LIIGA/MODEL/procedures/*/*.py
      - name: Semanttisten mallien YAML vastaa koodia
        # snowflake/LIIGA/MODEL/semantic_views/*.yaml generoidaan scripts/deploy/semantic_views.py:stä.
        # Jos joku muokkasi koodia mutta ei generoinut tiedostoja, PR kaatuu.
        run: |
          python scripts/deploy/semantic_views.py --write
          git diff --exit-code snowflake/LIIGA/MODEL/semantic_views/
      - name: Skillin renderöinti toimii esimerkkidatalla
        run: |
          python - <<'PY'
          import sys, tempfile
          sys.path.insert(0, "snowflake/LIIGA/CODE/stages/AGENT_SKILLS/esikatselu-html")
          from render import render, _parse
          row = {"ottelu": "18:30 HPK – Ilves",
                 "ennuste": "Ennuste: HPK 43,2 % · Ilves 56,8 % (jatkoaika 23,9 %)",
                 "tilanne": "Tilanne: HPK 10. (18 p, vire 9/15) · Ilves 1. (26 p, vire 9/15)",
                 "maalivahdit": "Todennäköiset maalivahdit: Kim Saarinen (+9,3) – Mantas Armalis (+7,1)",
                 "keskinaiset": None, "suosikki": "Ilves"}
          g = _parse(row)
          assert g["ph"] == 43.2 and g["hr"] == 10 and g["ags"] == 7.1, g
          path = render([row], title="CI", out_dir=tempfile.mkdtemp())
          assert "HPK – Ilves" in open(path, encoding="utf-8").read()
          print("ok", path)
          PY

  app:
    # Next.js-sovellus ilman Snowflakea: tyypit ja tuotantokäännös.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/package-lock.json
      - name: Riippuvuudet ja tietoturva (npm audit, tuotantoriippuvuudet)
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Tyypit
        run: npm run typecheck
      - name: Tuotantokäännös
        run: npm run build
