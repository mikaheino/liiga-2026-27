# GitHub Pages: Liiga Ennuste ilman agenttia ja LinkedIn-osiota (27.10.).
#
# Kolmas, itsenäinen ajopaikka Macin (launchd) ja Snowflaken (LIIGA_DAILY) rinnalla:
# hakee tulokset itse liiga.fi:stä, laskee ennusteen kertakäyttöisessä runnerissa ja
# julkaisee staattisen sivun. Yhteistä muiden kanssa on vain koodi gitissä.
# Repon data/liiga.duckdb on lähtöpiste; Pagesin oma ennustehistoria säilyy
# pages-data-haarassa (scripts/deploy/pages_history.py). Main-haaraan ei kirjoiteta.
name: pages

on:
  schedule:
    # Parittomat minuutit (käyttäjä 31.10.): tasatunnit ja -vartit ovat GitHubin
    # ajastimen ruuhkaisimmat hetket. Mitatut viiveet 28.-31.10. olivat aamuajossa
    # 6 h ja iltaajossa 3,5 h. Siirto ei poista viivettä -- ajastus ei ole lupaus,
    # ks. docs/claude/app.md -- mutta ei myöskään osu pahimpaan jonoon.
    # Aamuajo tallentaa päivän ennustehistorian -- ennen ottelua annettua ennustetta
    # ei voi laskea jälkikäteen, joten yksi laukaisu ei riitä: 31.10. klo 05.17 UTC:n
    # laukaisu jäi kokonaan tulematta ja aamun ajo tehtiin käsin. Kolme aamulaukaisua,
    # kaikki ennen sunnuntain aikaisinta aloitusta (15.00 Suomen aikaa = 13 UTC).
    # Uusinta on turvallinen: persist() korvaa saman päivän tilannekuvan.
    - cron: "17 5 * * *"       # 07.17 Suomen aikaa: yön tulokset + ennustehistoria
    - cron: "43 6 * * *"       # 08.43 varalaukaisu
    - cron: "27 8 * * *"       # 10.27 varalaukaisu
    # Illan tulokset samana iltana (31.10.). Ottelut alkavat 15.00-17.30 UTC ja
    # päättyvät 17.00-20.15 UTC, joten puolen tunnin tahti tuossa ikkunassa vie
    # tuloksen sivulle n. 15 min loppusireenin jälkeen -- ennen tätä se ehti
    # sivulle vasta seuraavana aamuna, koska `grace_hours` esti hakemisen.
    # Nämä eivät tallenna ennustehistoriaa, ks. "Tallenna historia" alla.
    - cron: "9,39 17-20 * * *"
  workflow_dispatch:
    inputs:
      history:
        # news.yml (klo 14) ja absence.yml (OK-nappi) julkaisevat sivun uudelleen
        # arvolla false: illalla pelattujen otteluiden jälkeen laskettu ajo ei saa
        # korvata päivän ennustehistoriaa (ennen ottelua tehty ennuste katoaisi).
        description: Tallenna päivän ennustehistoria pages-data-haaraan
        type: boolean
        default: true

permissions:
  contents: write              # pages-data-haaran päivitys
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/package-lock.json

      - name: Riippuvuudet
        # .venv, koska sovelluksen DuckDB-silta (lib/snowflake.ts) ajaa .venv/bin/pythonia.
        run: python -m venv .venv && .venv/bin/pip install -q -e .

      - name: Pagesin ennustehistoria (pages-data)
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$URL" pages-data >/dev/null; then
            git clone -q --depth 1 --branch pages-data "$URL" .pages-data
          else
            git init -q -b pages-data .pages-data && git -C .pages-data remote add origin "$URL"
          fi
          .venv/bin/python scripts/deploy/pages_history.py restore .pages-data

      - name: Tulokset liiga.fi:stä ja ennuste
        # --grace 2: aletaan kysyä ottelua kahden tunnin kuluttua sen alusta, eikä
        # kahdeksan. Lopputulos tulee silti liiga.fi:n omasta `ended`-lipusta, ei
        # kellosta, joten lyhyempi odotus ei voi keksiä tulosta -- se vain näkee
        # sen heti. Snowflaken notebook pitää oletuksensa 8 (pipeline.py).
        run: .venv/bin/python scripts/local/daily_update.py --no-sync --grace 2

      - name: Onko päivän ensimmäinen ottelu jo alkanut
        # Myöhästynyt aamuajo on vaarallinen, ei vain myöhäinen: persist() korvaa
        # päivän tilannekuvan, ja alkaneet ottelut eivät ole siinä mukana -- tallennus
        # pyyhkisi juuri sen ennusteen, jota varten historia on olemassa. Mitatut
        # myöhästymiset ovat tunteja, joten kellonaika ei riitä: kysytään kannasta.
        # start_ts on UTC-merkkijono ja kaikki otteluajat osuvat samalle UTC-päivälle
        # kuin Suomen päivä (aikaisin aloitus 15.00 = 13 UTC), joten UTC-päivä riittää.
        id: pre
        run: |
          .venv/bin/python - <<'PY'
          import datetime as dt
          import os

          import duckdb

          now = dt.datetime.now(dt.timezone.utc)
          today = now.date().isoformat()
          con = duckdb.connect("data/liiga.duckdb", read_only=True)
          first = con.execute(
              "SELECT MIN(start_ts) FROM stg_games WHERE season = (SELECT MAX(season) FROM stg_games) "
              "AND SUBSTR(start_ts, 1, 10) = ?", [today]).fetchall()[0][0]
          con.close()
          started = bool(first) and dt.datetime.fromisoformat(first.replace("Z", "+00:00")) <= now
          print(f"{today}: ensimmäinen ottelu {first or '-'}, nyt {now.isoformat(timespec='seconds')} "
                f"-> {'alkanut, historiaa ei tallenneta' if started else 'ei ole alkanut'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"started={'1' if started else '0'}\n")
          PY

      - name: Tallenna historia
        # Vain aamuajo ennen ottelujen alkua: illan ajo laskee ennusteen pelattujen
        # otteluiden jälkeen, ja myöhästynyt aamuajo on sama asia.
        if: >-
          steps.pre.outputs.started == '0' &&
          ((github.event_name == 'schedule' &&
            contains(fromJSON('["17 5 * * *","43 6 * * *","27 8 * * *"]'), github.event.schedule))
           || inputs.history)
        run: |
          .venv/bin/python scripts/deploy/pages_history.py save .pages-data
          cd .pages-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Pages-ennuste $(date -u +%F)" || echo "ei muutoksia"
          git push -q origin pages-data

      - name: Uutiset ja haastaja (news-data)
        # Uutiset, hyväksytyt poissaolot ja haastajan ennusteet sovelluksen tauluiksi
        # (scripts/news/load_news.py); haaraa ei vielä ole -> tyhjät taulut.
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git clone -q --depth 1 --branch news-data "$URL" .news-data || mkdir -p .news-data
          .venv/bin/python scripts/news/load_news.py .news-data
          # Haastajan kausiennuste: voimassa olevat poissaolot niiden otteluihin, kausi uudelleen.
          .venv/bin/python scripts/news/challenger_season.py .news-data .pages-data
          # Haastajan kausiennuste talteen joka ajossa (päivän rivit korvautuvat).
          cd .pages-data
          git add challenger_history.csv
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Haastajan kausiennuste $(TZ=Europe/Helsinki date +%F\ %H:%M)" || echo "ei muutoksia"
          ../.github/scripts/push-retry.sh pages-data

      - name: Staattinen sivu
        env:
          # Kirjautumisen välipalvelin (workers/hyvaksynta); repon muuttuja APPROVE_URL.
          # Tyhjä = kirjautumislinkkiä ei näytetä.
          NEXT_PUBLIC_APPROVE_URL: ${{ vars.APPROVE_URL }}
        run: BASE_PATH="/${{ github.event.repository.name }}" scripts/deploy/pages_build.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
