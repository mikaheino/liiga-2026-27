# Sovelluksen julkaisu (Liiga Ennuste, Next.js Snowflake App Runtimessa, sis. Mouho-pelin):
#   6.11.: palvelut skeemassa LIIGA.APP, julkaisu ja omistus roolilla LIIGA_APP (kapea
#   ajorooli: sovelluksen kyselyt ja agenttikutsut ajetaan omistajan oikeuksin).
#   ehdokas: käännös Snowflakessa -> LIIGA_ENNUSTE_STAGING käynnissä ja vastaa
#   tuotanto (hyväksyntä): SAMA käännös -> LIIGA_ENNUSTE (--promote-only) + oikeus
#            käyttäjäroolille
# Erillään agentin putkesta (deploy.yml) 17.10.: oma jono, oma hyväksyntä.
#
# Palvelut sammuvat itse 5 min käyttämättöminä (app.yml: auto_suspend_secs 300,
# auto_resume), joten ehdokas ei jää kuluttamaan.
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/**
      - snowflake/LIIGA/MODEL/tables/KORTTI_VASTAUS.sql
      - snowflake/LIIGA/MODEL/tables/SKENAARIO_HAKU.sql
      - snowflake/LIIGA/MODEL/tables/ROSTER_REQUESTS.sql
      - snowflake/LIIGA/MODEL/procedures/SIMULATE_SCENARIO/**
      - .github/workflows/deploy-app.yml
      - .github/actions/**
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  LIIGA_SNOW_CONNECTION: ci
  LIIGA_SNOW_ROLE: LIIGA_DEPLOYER
  LIIGA_SNOW_WAREHOUSE: LIIGA_WH
  SNOWFLAKE_ACCOUNT: ZUEEMDQ-CONTAINER_SERVICES
  SNOWFLAKE_USER: LIIGA_CI

defaults:
  run:
    working-directory: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE

jobs:
  candidate:
    name: Sovellus (STAGING)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # skenaarioproseduurin nimi = työkalun lähteen viimeisin commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/package-lock.json
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      - name: Tyypit ennen Snowflake-käännöstä
        run: npm ci && npm run typecheck
      # Ottelukortin vastaustaulu (CardAgent.tsx). Idempotentti ja jaettu STAGINGin ja
      # tuotannon kesken, kuten LIIGA.MODELin muutkin taulut; julkaisurooli omistaa sen.
      - name: Ottelukortin vastaustaulu
        run: snow sql -c ci -f ../../../MODEL/tables/KORTTI_VASTAUS.sql
      # Etusivun skenaariohaut ja vastaukset (ScenarioBoard.tsx, 7.11.2026). Sama malli.
      - name: Skenaariohakujen taulu
        run: snow sql -c ci -f ../../../MODEL/tables/SKENAARIO_HAKU.sql
      # Rosterijono (lib/rosterQueue.ts, 7.11.2026). Sama malli.
      - name: Rosterijonon taulu
        run: snow sql -c ci -f ../../../MODEL/tables/ROSTER_REQUESTS.sql
      # Joukkuesivun skenaariopaneeli kutsuu samaa proseduuriversiota kuin agentin
      # työkalu liiga_skenaario (deploy.yml julkaisee sen). Nimi app.yml:n
      # ympäristömuuttujaksi; käännös kaatuu, jos proseduuria ei vielä ole.
      - name: Skenaarioproseduurin versio
        shell: bash
        run: |
          proc="SIMULATE_SCENARIO$(cd "$GITHUB_WORKSPACE" && python -c 'import sys; sys.path.insert(0, "scripts/deploy"); import deploy_tools; print(deploy_tools.suffix("SIMULATE_SCENARIO", False))')"
          snow sql -c ci --format json -q "SHOW PROCEDURES LIKE '$proc' IN SCHEMA LIIGA.MODEL" | python -c "import json,sys; assert json.load(sys.stdin), '$proc puuttuu: aja ensin deploy.yml'"
          printf '  - name: LIIGA_SCENARIO_PROC\n    value: "%s"\n' "$proc" >> app.yml
          echo "skenaarioproseduuri: $proc" >> "$GITHUB_STEP_SUMMARY"
      # Qwen 2.5 3B (8.11.2026): Snowflaken käännösympäristö ei pääse Hugging Faceen ("Failed to fetch
      # manifest"), joten malli haetaan tässä kerran, pidetään GitHubin välimuistissa ja ladataan
      # sovelluspaketin mukana. Käynnistyksessä ei verkkohakuja (instrumentation.ts lataa muistiin).
      - name: Qwen-malli välimuistista
        uses: actions/cache@v4
        with:
          path: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/models
          key: qwen2.5-3b-instruct-q4_k_m
      - name: Qwen-malli (jos ei välimuistissa)
        run: ls models/*.gguf 2>/dev/null || npx --no node-llama-cpp pull --dir models "hf:Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M"
      - name: Käännös ja ehdokas (LIIGA_ENNUSTE_STAGING)
        run: snow app deploy --target staging -c ci --role LIIGA_APP --no-interactive
      - name: Ehdokas käynnissä
        shell: bash
        run: |
          snow sql -c ci --format json -q "SHOW APPLICATION SERVICES LIKE 'LIIGA_ENNUSTE_STAGING' IN SCHEMA LIIGA.APP" > svc.json
          python - <<'PY'
          import json, os
          r = json.load(open("svc.json"))
          assert r, "LIIGA_ENNUSTE_STAGING puuttuu"
          state = {k.lower(): v for k, v in r[0].items()}
          print({k: state.get(k) for k in ("name", "status", "url", "auto_suspend_secs")})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Sovellus (STAGING)\n\n`LIIGA.APP.LIIGA_ENNUSTE_STAGING`: {state.get('status')}, https://{state.get('url')}\n")
          PY

  prod:
    name: Sovellus tuotantoon (vaatii hyväksynnän)
    needs: candidate
    if: vars.PRODUCTION_PROTECTED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Ympäristömuuttujat tulevat app.yml:stä myös --promote-only-ajossa: ilman tätä tuotannosta puuttui
      # LIIGA_SCENARIO_PROC (8.11.2026: "skenaarioproseduuria ei ole määritetty"), STAGINGissa se oli.
      - name: Skenaarioproseduurin versio (tuotanto)
        shell: bash
        working-directory: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE
        run: |
          proc="SIMULATE_SCENARIO$(cd "$GITHUB_WORKSPACE" && python -c 'import sys; sys.path.insert(0, "scripts/deploy"); import deploy_tools; print(deploy_tools.suffix("SIMULATE_SCENARIO", False))')"
          snow sql -c ci --format json -q "SHOW PROCEDURES LIKE '$proc' IN SCHEMA LIIGA.MODEL" | python -c "import json,sys; assert json.load(sys.stdin), '$proc puuttuu: aja ensin deploy.yml'"
          printf '  - name: LIIGA_SCENARIO_PROC\n    value: "%s"\n' "$proc" >> app.yml
      - name: Sama käännös kuin STAGING tuotantoon
        shell: bash
        run: |
          snow app deploy --target prod --promote-only -c ci --role LIIGA_APP --no-interactive
          snow sql -c ci --role LIIGA_APP -q "GRANT USAGE ON APPLICATION SERVICE LIIGA.APP.LIIGA_ENNUSTE TO ROLE LIIGA_AGENT_USER"
          url=$(snow sql -c ci --format json -q "SHOW APPLICATION SERVICES LIKE 'LIIGA_ENNUSTE' IN SCHEMA LIIGA.APP" | python -c "import json,sys; print(next((r.get('url') for r in json.load(sys.stdin) if r.get('name') == 'LIIGA_ENNUSTE'), ''))")
          echo "### Sovellus tuotannossa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$url" >> "$GITHUB_STEP_SUMMARY"
