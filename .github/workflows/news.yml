# Uutiskeräin, uutismallin vaihe 0 (27.10.; docs/uutismalli_suunnitelma.md).
# Kerran päivässä (käyttäjä 27.10.): Ylen SM-liiga-aihesyöte (~7 vrk) ja seurojen
# omat sivut -> news-data-haaran news_items.csv. Ei kielimallia, ei vaikutusta
# ennusteeseen; vain otsikko, linkki, joukkue ja avainsanaliput.
name: news

on:
  schedule:
    - cron: "50 4 * * *"       # ennen Pages-ajoa (05.15 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Riippuvuudet
        run: pip install -q requests
      - name: Keräys
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$URL" news-data >/dev/null; then
            git clone -q --depth 1 --branch news-data "$URL" .news-data
          else
            git init -q -b news-data .news-data && git -C .news-data remote add origin "$URL"
          fi
          python scripts/news/collect.py .news-data | tee -a "$GITHUB_STEP_SUMMARY"
          cd .news-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Uutiset $(date -u +%FT%H:%MZ)" || { echo "ei uusia"; exit 0; }
          git push -q origin news-data
