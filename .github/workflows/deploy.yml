# Agentin julkaisu Snowflaken versiointimallilla:
#   ehdokas: uusi nimetty versio (alias STAGING) -> evaluointi + laatuportti
#   tuotanto (hyväksyntä): PRODUCTION-alias + oletus TÄSMÄLLEEN evaluoituun
#            versioon -> tagi agent-vN + Release evaluoinnin tuloksella
# Palautus: python scripts/deploy/deploy_agent.py --promote VERSION$N.
#
# Ajetaan kun agentin, semanttisten mallien, näkymien tai skillin lähde muuttuu
# mainissa, tai käsin (workflow_dispatch). Snowflakeen kirjaudutaan
# palvelukäyttäjänä LIIGA_CI avainparilla (snowflake/_account/roles/LIIGA_DEPLOYER.sql); rooli on
# rajattu LIIGA_DEPLOYER.
#
# Asetukset GitHubissa (Settings):
#   Secrets and variables -> Actions -> secret SNOWFLAKE_PRIVATE_KEY
#     = ~/.snowflake/keys/liiga_ci_rsa_key.p8 koko sisältö
#   Environments -> "production" -> Required reviewers: mikaheino
#     (tuotantoon ei mene mitään ilman hyväksyntää)
#   Variables -> PRODUCTION_PROTECTED = true   (VASTA kun hyväksyjä on asetettu)
name: Deploy agent

on:
  push:
    branches: [main]
    paths:
      - scripts/deploy/semantic_views.py
      - scripts/deploy/semantic_views_en.py
      - scripts/deploy/deploy_agent.py
      - scripts/deploy/agent_eval.py
      - scripts/deploy/snow_conn.py
      - snowflake/LIIGA/MODEL/views/**
      - scripts/deploy/deploy_views.py
      - snowflake/LIIGA/CODE/stages/AGENT_SKILLS/**
      - snowflake/LIIGA/MODEL/procedures/**
      - scripts/deploy/deploy_tools.py
      - snowflake/LIIGA/MODEL/cortex_search/LIIGA_TIETO/**
      - scripts/deploy/deploy_knowledge.py
      - snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/**
      - .github/workflows/deploy.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      message:
        description: "Tuotantoversion kommentti"
        required: false

concurrency:
  group: deploy-agent
  cancel-in-progress: false

env:
  LIIGA_SNOW_CONNECTION: ci
  LIIGA_SNOW_ROLE: LIIGA_DEPLOYER
  LIIGA_SNOW_WAREHOUSE: LIIGA_WH
  SNOWFLAKE_ACCOUNT: ZUEEMDQ-CONTAINER_SERVICES
  SNOWFLAKE_USER: LIIGA_CI

jobs:
  candidate:
    name: Ehdokasversio (STAGING) ja evaluointi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.agent.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # sv_sha() lukee git-historian
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Huom: näkymät eivät ole versioituja -- ne päivittyvät tuotannon
      # käyttöön jo tässä, ennen hyväksyntää. Muutokset kausi_views.sql:ään
      # pidetään yhteensopivina (sarakkeita lisätään, ei poisteta).
      - name: Näkymät
        run: python scripts/deploy/deploy_views.py
      - name: Semanttiset mallit (kiinnitetty git-committiin)
        run: python scripts/deploy/semantic_views.py --deploy
      - name: Työkaluproseduurit (kiinnitetty git-committiin)
        run: python scripts/deploy/deploy_tools.py
      - name: Tietopankki (Cortex Search, kiinnitetty git-committiin)
        run: python scripts/deploy/deploy_knowledge.py
      - name: Agentti (uusi nimetty versio, alias STAGING)
        id: agent
        # Commit-viesti ympäristömuuttujana, EI ${{ }}-lausekkeena komennon sisällä:
        # lauseke liitetään skriptiin tekstinä ennen bashia, joten viestin lainausmerkit
        # rikkoivat komennon 16.10. (d486dd8) -- ja mikä tahansa viesti olisi voinut
        # ajaa komentoja (GitHub Actions -skripti-injektio).
        shell: bash
        env:
          MSG: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: |
          python scripts/deploy/deploy_agent.py --alias STAGING --html -m "$(echo "$MSG" | head -1 | cut -c1-120)" | tee deploy.log
          V=$(grep -o 'VERSION\$[0-9]* (alias STAGING)' deploy.log | grep -o '[0-9]*' | head -1)
          test -n "$V" || { echo "::error::agenttiversiota ei löytynyt"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Evaluointi ja laatuportti (STAGING)
        run: python scripts/deploy/agent_eval.py --version STAGING --gate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-candidate
          path: snowflake/LIIGA/EVALS/results/

  app-candidate:
    name: Sovellus (STAGING)
    # Rinnakkain agentin ehdokkaan kanssa: App Runtimen käännös (npm ci + next build
    # Snowflakessa) ei odota agentin evaluointia eikä päinvastoin.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE/package-lock.json
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      - name: Tyypit ennen Snowflake-käännöstä
        run: npm ci && npm run typecheck
      - name: Käännös ja ehdokas (LIIGA_ENNUSTE_STAGING)
        run: snow app deploy --target staging -c ci --no-interactive
      - name: Ehdokas käynnissä
        shell: bash
        run: |
          snow sql -c ci --format json -q "SHOW APPLICATION SERVICES LIKE 'LIIGA_ENNUSTE_STAGING' IN SCHEMA LIIGA.CODE" > svc.json
          python - <<'PY'
          import json, os
          r = json.load(open("svc.json"))
          assert r, "LIIGA_ENNUSTE_STAGING puuttuu"
          state = {k.lower(): v for k, v in r[0].items()}
          print({k: state.get(k) for k in ("name", "status", "state", "url", "endpoint")})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Sovellus (STAGING)\n\n`LIIGA.CODE.LIIGA_ENNUSTE_STAGING`: {state.get('status') or state.get('state')}\n")
          PY

  prod:
    name: Tuotanto (vaatii hyväksynnän)
    needs: [candidate, app-candidate]
    # Turvalukko: GitHub luo puuttuvan ympäristön automaattisesti ILMAN
    # hyväksyjää. Tuotanto ajetaan vain, kun repo-muuttuja
    # PRODUCTION_PROTECTED = true on asetettu -- tee se vasta kun
    # "production"-ympäristöllä on Required reviewers.
    if: vars.PRODUCTION_PROTECTED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write           # tagi ja Release
    env:
      V: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: ./.github/actions/snowflake-setup
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Versio nimetään numerolla, ei aliaksella STAGING: tuotantoon menee
      # täsmälleen se, joka evaluoitiin, vaikka STAGING olisi välissä siirtynyt.
      - name: Promootio (PRODUCTION + oletusversio)
        run: python scripts/deploy/deploy_agent.py --promote "VERSION\$$V"
      - name: Sovellus tuotantoon (sama käännös kuin STAGING)
        working-directory: snowflake/LIIGA/CODE/application_services/LIIGA_ENNUSTE
        run: |
          snow app deploy --target prod --promote-only -c ci --no-interactive
          snow sql -c ci -q "GRANT USAGE ON APPLICATION SERVICE LIIGA.CODE.LIIGA_ENNUSTE TO ROLE LIIGA_AGENT_USER"
      - uses: actions/download-artifact@v7
        with:
          name: eval-candidate
          path: snowflake/LIIGA/EVALS/results/
      - name: Tagi ja Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agent-v$V"
          git tag -a "$TAG" -m "Liiga Ennustaja VERSION\$$V" && git push origin "$TAG"
          python - > notes.md <<'PY'
          import json, os
          s = json.load(open("snowflake/LIIGA/EVALS/results/last_summary.json"))
          print(f"Snowflake-agentti `LIIGA_ENNUSTAJA` **VERSION${os.environ['V']}**, alias `PRODUCTION`.\n")
          print(f"Evaluoitu ennen julkaisua aliaksella STAGING, ajo {s['run']} ({s['n']} kysymystä):\n")
          print("| mittari | keskiarvo |\n|---|---:|")
          for k, v in s["metrics"].items():
              print(f"| {k} | {v:.2f} |")
          if s["low"]:
              print("\nHeikot (< 0,67): " + "; ".join(s["low"]))
          PY
          gh release create "$TAG" --title "Liiga Ennustaja $TAG" --notes-file notes.md
