<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouhon salaisuus v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* Mouhon salaisuus -- point-and-click 1990-luvun LucasArts-hengessä.
   Kolme pelattavaa ruutua: kotilaituri, Istanbulin basaari, luolatemppeli.
   Kaikki grafiikka piirretään koodilla canvasille; ei ulkoisia kuvia. */
:root {
  --bg: #000; --ui: #000; --verb: #2c7c2c; --verb-hi: #5cfc5c; --sentence: #5cfcfc;
  --inv: #1c1c6c; --inv-hi: #fcfc54; --txt: #fcfcfc;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #000; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: "VT323", ui-monospace, monospace; }
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#game { width: min(960px, 100%); position: relative; user-select: none; }
#stage { position: relative; width: 100%; aspect-ratio: 320 / 136; background: #000; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
#say { position: absolute; inset: 0; pointer-events: none; }
/* Puhekupla: valkoinen, puhujan värinen reunus, häntä puhujan päähän (--tail = sivusiirtymä). */
.bubble { position: absolute; transform: translateX(-50%); width: max-content; max-width: 48%; padding: .35em .6em .4em; background: #fcfcf4; color: #1c1c1c;
  border: 3px solid var(--c, #1c1c1c); border-radius: 14px; box-shadow: 3px 3px 0 rgba(0,0,0,.55); text-align: center;
  font-size: clamp(14px, 2.4vw, 24px); line-height: 1.05; white-space: pre-line; animation: pop .14s ease-out both; }
.bubble::after, .bubble::before { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); transform: translateX(-50%); width: 0; height: 0; border-style: solid; }
.bubble::before { top: 100%; border-width: 13px 9px 0 9px; border-color: var(--c, #1c1c1c) transparent transparent transparent; }
.bubble::after { top: calc(100% - 1px); border-width: 9px 6px 0 6px; border-color: #fcfcf4 transparent transparent transparent; }
@keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
/* Kertoja: tekstilaatikko ruudun yläreunassa, kuin sarjakuvan tekstiruutu. */
.caption { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 80%; padding: .3em .7em; background: #fcf09c; color: #2c1c08;
  border: 3px solid #2c1c08; box-shadow: 3px 3px 0 rgba(0,0,0,.55); text-align: center; font-size: clamp(14px, 2.4vw, 24px); line-height: 1.05; white-space: pre-line; }
.line { position: absolute; transform: translateX(-50%); max-width: 46%; text-align: center; font-size: clamp(15px, 2.6vw, 26px); line-height: 1.05;
  text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 2px 2px #000; white-space: pre-line; }
#sentence { height: 1.4em; text-align: center; color: var(--sentence); font-size: clamp(16px, 2.8vw, 28px); padding-top: 4px; }
#ui { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; padding: 4px 6px 10px; min-height: 9.2em; font-size: clamp(16px, 2.8vw, 28px); }
#verbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 6px; align-content: start; }
#verbs button, #dialog button { all: unset; cursor: pointer; color: var(--verb); line-height: 1.15; }
#verbs button:hover, #verbs button.on { color: var(--verb-hi); }
#verbs button.def { color: #a8fca8; text-shadow: 0 0 6px #2c7c2c; }
#inv { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(0, max-content); gap: 6px; align-content: start; background: var(--inv); padding: 6px; border: 2px solid #3c3cac; }
/* Tavarat kuvakkeina (MI2): 24 x 16 pikseliä, skaalattu terävänä. */
#inv button { all: unset; cursor: pointer; display: grid; place-items: center; aspect-ratio: 3 / 2; background: #10104c; border: 1px solid #2c2c8c; }
#inv button img { width: 100%; height: 100%; image-rendering: pixelated; }
#inv button:hover { border-color: #a8a8fc; } #inv button.sel { border-color: var(--inv-hi); background: #2c2c6c; }
.sys button { all: unset; cursor: pointer; color: #5c8c5c; } .sys button:hover { color: var(--verb-hi); }
#dialog { display: none; flex-direction: column; gap: 2px; padding: 4px 6px 10px; min-height: 9.2em; font-size: clamp(16px, 2.8vw, 28px); }
#dialog button { color: #fc54fc; } #dialog button.asked { color: #7c3c9c; } #dialog button:hover { color: #fcfc54; }
#iq { color: #fcc81c; }
#game.talking #ui { display: none; } #game.talking #dialog { display: flex; }
#game.cut canvas { cursor: wait; }
.hint { margin-top: 10px; color: #545454; font-size: 18px; text-align: center; }
@media (max-width: 520px) { #ui { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="game">
  <div id="stage"><canvas id="c" width="320" height="136"></canvas><div id="say"></div></div>
  <div id="sentence"></div>
  <div id="ui"><div id="verbs"></div><div id="inv"></div></div>
  <div id="dialog"></div>
  <div class="hint">Valitse verbi, sitten kohde. Oikea painike = oletustoiminto. Esc tai klikkaus ohittaa repliikin.
    <span class="sys"><span id="iq">Mouho-IQ 0 / 100</span> · <button id="hint">Vihje</button> · <button id="save">Tallenna</button> · <button id="load">Lataa</button></span></div>
</div>
<script>/* engine.js */
// =============================================================================
// MOUHO-MOOTTORI -- pieni SCUMM-henkinen point-and-click-moottori selaimeen.
//
// Oma toteutus (SCUMM ja sen työkalut ovat LucasArtsin/Disneyn omaisuutta);
// periaatteet Video Game History Foundationin julkisesta Monkey Island -aineistosta:
//   * kävelyalueet (walk boxes) monikulmioina + A*-reitinhaku ruudukossa
//   * syvyystasot (z-planes): hahmot ja esineet piirretään jalkojen y:n mukaan
//   * hahmot (actors) puku- eli costume-funktiolla, kävely 4 suuntaan, puheanimaatio
//   * verbit, tavarakuvakkeet, oletustoiminto oikealla painikkeella
//   * skriptit async-funktioina: say / walkTo / choose / cutscene
//
// Sisältö (ruudut, esineet, tarina) on game.js:ssä, grafiikka art.js:ssä.
// =============================================================================
"use strict";
const W = 320, H = 136;
const cv = document.getElementById("c"), main = cv.getContext("2d");
let g = main;                         // piirtokohde: pääcanvas tai taustan välimuisti
const $say = document.getElementById("say"), $sent = document.getElementById("sentence");
const $verbs = document.getElementById("verbs"), $inv = document.getElementById("inv"), $dlg = document.getElementById("dialog");
const $game = document.getElementById("game");

// ---------------------------------------------------------------- piirtäminen
// VGA-henki: 320 x 136, liukuvärit Bayer-ditheröintinä eikä sileinä. Staattiset
// taustat piirretään kerran välimuistiin (bgCache), joka ruudussa vain liike.
const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); };
const px = (x, y, c) => r(x, y, 1, 1, c);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function dither(x, y, w, h, a, b, t = 0.5) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, bay(x + i, y + j) < t ? b : a); }
// Pystysuora liukuväri väripaletin läpi, ditheröity siirtymä jokaisen värin välissä.
function vgrad(x, y, w, h, cols) {
  for (let j = 0; j < h; j++) {
    const f = (j / Math.max(h - 1, 1)) * (cols.length - 1), k = Math.min(Math.floor(f), cols.length - 2), t = f - k;
    for (let i = 0; i < w; i++) px(x + i, y + j, bay(x + i, y + j) < t ? cols[k + 1] : cols[k]);
  }
}
let seed = 1; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function noise(x, y, w, h, base, cols, p) { r(x, y, w, h, base); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (rnd() < p) px(x + i, y + j, cols[(rnd() * cols.length) | 0]); }
function disc(cx, cy, rad, c, edge) { for (let j = -rad; j <= rad; j++) for (let i = -rad; i <= rad; i++) { const d = i * i + j * j; if (d <= rad * rad) px(cx + i, cy + j, edge && d > (rad - 1) * (rad - 1) ? edge : c); } }
function tri(x, y, w, h, c) { for (let j = 0; j < h; j++) { const ww = Math.round(w * (j + 1) / h); r(x + (w - ww) / 2, y + j, ww, 1, c); } }
function shadow(x, y, w) { g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(x, y, w, 2, 0, 0, 7); g.fill(); }
function glow(x, y, rad, rgb, a) { const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); g.globalCompositeOperation = "source-over"; }
const bgCache = {};
function paintBg(name, fn) { if (bgCache[name]) return bgCache[name]; const c = document.createElement("canvas"); c.width = W; c.height = H; const prev = g; g = c.getContext("2d"); seed = 7; fn(); g = prev; return (bgCache[name] = c); }
function starfield(n, maxY, s0) { seed = s0; const out = []; for (let i = 0; i < n; i++) out.push([(rnd() * W) | 0, (rnd() * maxY) | 0, rnd()]); return out; }

// ---------------------------------------------------------------- tila
// st = pelaajahahmo (Jussi) + pelin muisti. Tallennetaan sellaisenaan.
const st = { scene: "koti", x: 60, y: 126, dir: 1, frame: 0, path: [], hat: false, whip: false, inv: [], flags: {} };
const ROOMS = {}, ITEMS = {};
const VERBS = ["Anna", "Poimi", "Käytä", "Avaa", "Katso", "Työnnä", "Sulje", "Puhu", "Vedä"];
let verb = "Kävele", first = null, busy = false, onArrive = null, overlay = null, speaking = null, skip = null;
const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
const has = (k) => st.inv.includes(k);
function give(k) { if (!has(k)) st.inv.push(k); renderInv(); }
function take(k) { st.inv = st.inv.filter((x) => x !== k); if (first === k) first = null; renderInv(); }
const room = () => ROOMS[st.scene];

// ---------------------------------------------------------------- kävelyalueet ja reitinhaku
// Ruudukko 2 px:n soluina. Solu on kävelykelpoinen, jos sen keskipiste on
// jonkin ruudun kävelymonikulmion sisällä. Monikulmiot voivat riippua tilasta
// (temppelin kuilun takaosa aukeaa vasta ruoskalla), siksi ruudukko lasketaan
// joka reitinhaulla -- 160 x 68 solua on halpa.
const CELL = 2, GW = W / CELL, GH = Math.ceil(H / CELL);
function inPoly(x, y, poly) { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j];
  if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside; } return inside; }
function polys() { const w = room()?.walk; return typeof w === "function" ? w() : w ?? []; }
function grid() { const ps = polys(), m = new Uint8Array(GW * GH); for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) { const x = i * CELL + 1, y = j * CELL + 1; if (ps.some((p) => inPoly(x, y, p))) m[j * GW + i] = 1; } return m; }
function nearest(m, ci, cj) {                          // lähin kävelykelpoinen solu (BFS)
  const seen = new Uint8Array(GW * GH), q = [[ci, cj]]; seen[cj * GW + ci] = 1;
  while (q.length) { const [i, j] = q.shift(); if (m[j * GW + i]) return [i, j];
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const a = i + di, b = j + dj; if (a >= 0 && b >= 0 && a < GW && b < GH && !seen[b * GW + a]) { seen[b * GW + a] = 1; q.push([a, b]); } } }
  return null;
}
function lineFree(m, x0, y0, x1, y1) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)); for (let k = 0; k <= n; k++) { const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n; if (!m[Math.floor(y / CELL) * GW + Math.floor(x / CELL)]) return false; } return true; }
function findPath(x0, y0, x1, y1) {
  const m = grid(), clampC = (v, n) => Math.max(0, Math.min(n - 1, Math.floor(v / CELL)));
  const s = nearest(m, clampC(x0, GW), clampC(y0, GH)), e = nearest(m, clampC(x1, GW), clampC(y1, GH)); if (!s || !e) return [];
  const goal = [e[0] * CELL + 1, e[1] * CELL + 1];
  const ex = goal[0] === Math.floor(x1 / CELL) * CELL + 1 && goal[1] === Math.floor(y1 / CELL) * CELL + 1 ? [x1, y1] : goal;
  // A* 8 suuntaan
  const N = GW * GH, gS = new Float32Array(N).fill(Infinity), from = new Int32Array(N).fill(-1), open = [], closed = new Uint8Array(N);
  const id = (i, j) => j * GW + i, hh = (i, j) => Math.hypot(i - e[0], j - e[1]);
  gS[id(...s)] = 0; open.push([hh(...s), s[0], s[1]]);
  while (open.length) {
    let bi = 0; for (let k = 1; k < open.length; k++) if (open[k][0] < open[bi][0]) bi = k;
    const [, i, j] = open.splice(bi, 1)[0], cur = id(i, j); if (closed[cur]) continue; closed[cur] = 1;
    if (i === e[0] && j === e[1]) break;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) { if (!di && !dj) continue; const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= GW || b >= GH || !m[id(a, b)]) continue;
      const ng = gS[cur] + (di && dj ? 1.414 : 1); if (ng < gS[id(a, b)]) { gS[id(a, b)] = ng; from[id(a, b)] = cur; open.push([ng + hh(a, b), a, b]); } }
  }
  if (from[id(...e)] < 0 && id(...e) !== id(...s)) return [];
  const raw = []; for (let c = id(...e); c >= 0 && c !== id(...s); c = from[c]) raw.unshift([(c % GW) * CELL + 1, Math.floor(c / GW) * CELL + 1]);
  raw.push(ex);
  // Suoristus: hypätään kauimpaan näkyvään pisteeseen, jottei reitti ole porrastettu.
  const out = []; let px0 = x0, py0 = y0, k = 0;
  while (k < raw.length) { let far = k; for (let q = raw.length - 1; q > k; q--) if (lineFree(m, px0, py0, raw[q][0], raw[q][1])) { far = q; break; } out.push(raw[far]); [px0, py0] = raw[far]; k = far + 1; }
  return out;
}
function walkTo(x, y = st.y) { return new Promise((res) => { st.path = findPath(st.x, st.y, x, y); onArrive = res; if (!st.path.length) { onArrive = null; res(); } }); }
function depth(y) { const sc = room()?.scale; if (!sc) return 1; const [y0, y1, s0 = 0.7, s1 = 1.02] = sc; return s0 + (s1 - s0) * Math.max(0, Math.min(1, (y - y0) / (y1 - y0))); }
function place(x, y) { st.x = x; st.y = y; st.path = []; onArrive = null; }

// ---------------------------------------------------------------- ääni
let actx = null;
function beep(freq, ms = 220, type = "square", vol = 0.06) { try { actx ??= new AudioContext(); const o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.value = freq; v.gain.value = vol; v.gain.setTargetAtTime(0, actx.currentTime + ms / 1000 * .6, .05); o.connect(v).connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000); } catch { /* ei ääntä */ } }

// ---------------------------------------------------------------- puhe ja skriptit
// Puhuja: "jussi", ruudun hahmon id (esim. "kauppias") tai "muu" (kertoja).
// Puhekuplat (16.10.): hahmojen repliikit sarjakuvakuplina, häntä puhujan päähän;
// kertoja ("muu") tekstilaatikkona ruudun yläreunassa.
function say(text, who = "jussi") {
  return new Promise((res) => {
    const npc = room()?.actors?.find((a) => a.id === who);
    const spk = who === "jussi" ? { x: st.x, y: st.y - 50 * depth(st.y), c: "#c8a460" } : npc ? { x: npc.x, y: npc.y - (npc.h ?? 44) * depth(npc.y), c: npc.color } : null;
    const el = document.createElement("div");
    if (!spk) el.className = "caption";
    else {
      // Kupla mitataan ja pidetään kokonaan ruudussa; häntä osoittaa silti puhujaan.
      el.className = "bubble"; el.style.left = (100 * spk.x / W) + "%"; el.style.bottom = (100 - 100 * (spk.y - 4) / H) + "%"; el.style.setProperty("--c", spk.c);
      requestAnimationFrame(() => { const stageW = $say.getBoundingClientRect().width, half = el.offsetWidth / 2 / stageW * W;
        const cx = Math.min(Math.max(spk.x, half + 2), W - half - 2), maxTail = Math.max(0, el.offsetWidth / 2 - 16);
        el.style.left = (100 * cx / W) + "%"; el.style.setProperty("--tail", Math.max(-maxTail, Math.min(maxTail, (spk.x - cx) / W * stageW)) + "px"); });
    }
    el.textContent = text; $say.replaceChildren(el); speaking = who;
    const done = () => { clearTimeout(tm); skip = null; speaking = null; el.remove(); res(); };
    const tm = setTimeout(done, 1300 + text.length * 55); skip = done;
  });
}
async function script(fn) { busy = true; $game.classList.add("cut"); try { await fn(); } finally { busy = false; $game.classList.remove("cut"); setSentence(); } }
// Keskustelu Fate of Atlantiksen tapaan: vaihtoehdot verbien paikalla, jo kysytyt
// himmeinä, valittu repliikki Jussin suuhun.
const asked = new Set();
function choose(options) {
  return new Promise((res) => {
    $game.classList.add("talking"); $dlg.replaceChildren(...options.map((o, i) => { const b = document.createElement("button"); b.textContent = o; if (asked.has(o)) b.className = "asked";
      // stopPropagation: muuten sama klikkaus kuplii dokumenttiin ja ohittaa heti Jussin repliikin.
      b.onclick = (e) => { e.stopPropagation(); asked.add(o); $game.classList.remove("talking"); res(i); }; return b; }));
  });
}

// Mouho-IQ (Fate of Atlantiksen "Indy Quotient"): pisteet oivalluksista, kukin kerran.
const IQ_MAX = 100;
function iq(key, n) { st.iq ??= {}; if (st.iq[key]) return; st.iq[key] = n; renderIq(); }
const iqTotal = () => Object.values(st.iq ?? {}).reduce((a, b) => a + b, 0);
function renderIq() { const el = document.getElementById("iq"); if (el) el.textContent = `Mouho-IQ ${iqTotal()} / ${IQ_MAX}`; }
function go(scene, x, keep, y) { st.scene = scene; const r0 = ROOMS[scene]; place(x, y ?? r0?.start ?? 126); if (r0?.enter) r0.enter(); if (!keep) setSentence(); }

// ---------------------------------------------------------------- verbit ja kohteet
const GENERIC = { Poimi: "En voi ottaa sitä.", Avaa: "Se ei aukea.", Sulje: "Se ei sulkeudu.", Työnnä: "Se ei liiku.", Vedä: "Se ei liiku.", Puhu: "Se ei vastaa. Hyvä niin.", Käytä: "En keksi, miten.", Anna: "Ei kiitos.", Katso: "Ei mitään erikoista." };
function spotsAt(x, y) { const s = room(); if (!s) return null; return s.spots.find((p) => !(p.hidden && p.hidden()) && x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h) || null; }
const nameOf = (o) => (typeof o === "string" ? ITEMS[o].name : o.name);
// Oletustoiminto (oikea painike ja korostettu verbi): hahmo -> Puhu, uloskäynti -> Kävele, muuten Katso.
const defVerb = (o) => (typeof o === "string" ? "Katso" : o.def ?? (o.actor ? "Puhu" : o.exit ? "Kävele" : "Katso"));
function setSentence(target) {
  if (busy) return;
  const join = verb === "Anna" ? " henkilölle " : " kanssa ";
  $sent.textContent = first ? `${verb} ${nameOf(first)}${join}${target ? nameOf(target) : ""}` : `${verb}${target ? " " + nameOf(target) : ""}`;
  const dv = target ? defVerb(target) : null; for (const b of $verbs.children) b.classList.toggle("def", b.textContent === dv);
}
async function act(v, target) {
  if (typeof target === "string") {
    if (v === "Katso") return script(ITEMS[target].look);
    if ((v === "Käytä" || v === "Anna") && !first) { first = target; renderInv(); setSentence(); return; }
    return script(() => say("Ei, se ei toimi noin."));
  }
  await walkTo(target.at, target.aty ?? (room().scale?.[0] ?? 126) + 3);
  st.dir = (target.x + target.w / 2) > st.x ? 1 : -1;
  const it = first; first = null; renderInv();
  const f = it ? (target[`${v}:${it}`] || (v === "Anna" && target.Anna && (() => target.Anna(it)))) : target[v];
  if (target.exit && !it && (v === "Kävele" || v === "Käytä")) return f && f();
  if (f) return script(f);
  if (it) return script(() => say("Se ei toimi."));
  if (v !== "Kävele") return script(() => say(GENERIC[v] || "Hmm."));
}

// ---------------------------------------------------------------- käyttöliittymä
function stagePos(e) { const b = cv.getBoundingClientRect(); return [((e.clientX - b.left) / b.width) * W, ((e.clientY - b.top) / b.height) * H]; }
cv.addEventListener("mousemove", (e) => { if (busy || !room()) return; const [x, y] = stagePos(e); setSentence(spotsAt(x, y)); });
function click(e, right) {
  if (skip) { skip(); return; } if (busy || !room() || overlay) return;

const streetX = (y) => { const k = (y - 72) / 64; return [lerp(142, 20, k) + 4, Math.min(204, lerp(178, 300, k))]; };

const QUIZ_AREA = { koti: { y0: 98, y1: 116, edges: pierX }, basaari: { y0: 100, y1: 116, edges: streetX }, temppeli: { y0: 103, y1: 117, edges: templeX } };
const quizFlag = (scene = st.scene) => (scene === "koti" ? "pianoT" : `quizT_${scene}`);
function keyAt(x, y) {
  const A = QUIZ_AREA[st.scene]; if (!A || y < A.y0 || y > A.y1) return null;
  const [a, b] = A.edges(y), i = Math.floor((x - a) / (b - a) * 10);
  return i >= 0 && i < 10 ? KEYS[i] : null;
}
function keyQuad(i) { const A = QUIZ_AREA[st.scene], [a0, b0] = A.edges(A.y0), [a1, b1] = A.edges(A.y1);
  return [[lerp(a0, b0, i / 10), A.y0], [lerp(a0, b0, (i + 1) / 10), A.y0], [lerp(a1, b1, (i + 1) / 10), A.y1], [lerp(a1, b1, i / 10), A.y1]]; }
let lastKey = { k: null, t: 0 };
// Numerot ilmestyvät valona vasta salkkumiehen haasteessa (st.flags.pianoT = hetki),
// kosketin kerrallaan vasemmalta oikealle.
function satamaPiano(t) {
  const A = QUIZ_AREA[st.scene]; if (!A || !st.flags[quizFlag()]) return;
  const since = Date.now() - st.flags[quizFlag()], flick = .9 + .1 * Math.sin(t / 70);
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 10; i++) {
    if (since < i * 90) continue;
    const q = keyQuad(i), lit = lastKey.k === KEYS[i] && t - lastKey.t < 450, fresh = since < i * 90 + 260, a = (lit ? .55 : fresh ? .45 : .16) * flick;
    g.fillStyle = `rgba(255,236,140,${a})`; g.beginPath(); q.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
    g.strokeStyle = `rgba(255,244,190,${lit ? .9 : .5})`; g.lineWidth = .6; g.stroke();
    // numero lattian kulmaan: leveys kuin koskettimen keskikohta, korkeus litistetty
    const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (A.y0 + A.y1) / 2 + 1, kw = (q[1][0] - q[0][0] + q[2][0] - q[3][0]) / 2;
    g.save(); g.translate(cx, cy); g.scale(1, .55); g.font = `${Math.round(kw * 1.05)}px VT323, monospace`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = `rgba(255,${lit ? 120 : 250},${lit ? 90 : 210},${lit ? 1 : .75})`; g.fillText(KEYS[i], 0, 0); g.restore();
    if (lit) glow(cx, cy, 16, "255,230,120", .3);

  g.globalCompositeOperation = "source-over"; g.textAlign = "left"; g.textBaseline = "alphabetic";
}

// Haamuilves (16.10.): oikean 1985-vastauksen jälkeen laiturin kanteen heijastuu hetkeksi

function ghostLynx(t) {
  if (!st.flags.ghostT) return;
  const since = Date.now() - st.flags.ghostT, D = 3200;
  if (since > D) return;
  const env = Math.sin(Math.PI * since / D), a = env * (.8 + .2 * Math.sin(t / 60)), rise = Math.min(1, since / 700);
  const cx = 160, cy = 92 - rise * 14, S = 1.15;

  const P = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); };

  P([[-18, -12], [-8, -20], [8, -20], [18, -12], [21, 2], [12, 15], [0, 19], [-12, 15], [-21, 2]], "#f0dc6c");
  // otsaraidat
  for (const x of [-6, 0, 6]) P([[x - 1, -19], [x + 1, -19], [x + .5, -11], [x - .5, -11]], "#6c5c1c");

  P([[-14, -4], [-9, -7], [-4, -4], [-9, -1]], "#fcf4a0"); P([[14, -4], [9, -7], [4, -4], [9, -1]], "#fcf4a0");
  P([[-9.6, -6.5], [-8.4, -6.5], [-8.4, -1.5], [-9.6, -1.5]], "#141408"); P([[8.4, -6.5], [9.6, -6.5], [9.6, -1.5], [8.4, -1.5]], "#141408");

  g.restore();
  // hologrammin juovat
  g.fillStyle = `rgba(0,0,0,${a * .25})`; for (let y = cy - 52; y < cy + 28; y += 2) g.fillRect(cx - 40, y, 80, 1);
}

// Hologrammi-apu: sama kesto ja kirjekuori kaikille haamuille (flag = alkuhetki).
function holo(t, flag, cx, cy, draw, D = 3200) {
  const t0 = st.flags[flag]; if (!t0) return; const since = Date.now() - t0; if (since > D) return;
  const a = Math.sin(Math.PI * since / D) * (.8 + .2 * Math.sin(t / 60)), rise = Math.min(1, since / 700), y = cy - rise * 14;
  glow(cx, y, 50, "170,220,255", a * .25); g.save(); g.globalAlpha = a * .85; g.translate(cx, y); draw(); g.restore();
  g.fillStyle = `rgba(0,0,0,${a * .25})`; for (let yy = y - 52; yy < y + 28; yy += 2) g.fillRect(cx - 40, yy, 80, 1);
}
const PP = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); };

function ghostTrophy(t) { holo(t, "trophyT", 160, 86, () => {

        await say("Totta kai! Rahoitusta myönnetään pientä ennakkomaksua vastaan. 3,50 € riittää alkuun.", "salkkumies");
        iq("laina", 5); await say(has("rahat") ? "Minulla on täsmälleen 3,50 € ja nappi. Ja minä pidän ne." : "Minulla ei ole edes 3,50 euroa. Se on tällä kertaa onni.");
        if (!has("kortti")) { await say("Ota ainakin käyntikortti. Siltä varalta, että muutat mielesi.", "salkkumies"); give("kortti"); } }
      else if (pick.startsWith("Tunnetko")) { st.flags.salesSignor = true;
        await say("Kuka kysyy? Siis... en ole koskaan kuullutkaan. Hieno mies. Luotettava. Mutta en tunne.", "salkkumies"); }
      else { await say("Soittele! Ja jos kuulet otteluohjelmasta, kerro minullekin.", "salkkumies"); return; }
    }
  });
}


// ---------------------------------------------------------------- vihjeet
// "Vihje"-nappi ja minuutin toimettomuus: seuraava askel tilan mukaan, ensin vihjaten,
// toisella kerralla suoraan. Kukaan ei jää jumiin (käyttäjä 16.10.).
const HINTS = () => {
  const f = st.flags, here = st.scene;
  if (here === "koti") {
    if (!f.unlocked && !f.pianoT) return ["Postilaatikko on lukossa. Tuo liituraitamies laiturilla näyttää tietävän jotain.", "Puhu salkkumiehelle ja kysy postilaatikon avaimesta."];
    if (!f.unlocked) return ["Ilves on Tampereelta. Viimeisin mestaruus tuli 80-luvulla. Numerot ovat laiturissa.", "Kävele laiturin numeroille 1, 9, 8 ja 5, tässä järjestyksessä."];
    if (!f.letterTaken) return ["Lukko on auki. Posti odottaa.", "Avaa postilaatikko ja poimi kirje."];
    if (!has("lippu")) return ["Kirjeessä voi olla muutakin kuin sanoja.", "Katso kirjettä: oikea painike kirjeen kuvaan tavaroissa."];
    if (!f.pig) return ["Matkat maksavat. Laiturilla on joku, joka säästää puolestani.", "Avaa säästöpossu laiturilla."];
    if (!st.hat) return ["Seikkailija ilman hattua on pelkkä turisti.", "Poimi fedora naulakosta laiturilta."];
    return ["Kaikki on valmista. Lentokenttä kutsuu.", "Käytä taksia oikealla."];
  }
  if (here === "basaari") {
    if (has("idoli")) return ["Mehmet ostaa kaiken. Ehkä kultaakin.", "Anna kultainen idoli Mehmetille."];
    if (!f.map) return ["Seinällä on matto, jossa on outoja kuvioita.", "Katso mattoa vasemmalla seinällä."];
    if (!f.bag) return ["Jotain ilmaista roikkuu naulassa. Ilmainen on aina epäilyttävää, mutta hyödyllistä.", "Poimi kangaspussi vasemmalta seinältä."];
    if (!st.whip) return ["Jokainen arkeologi tarvitsee ruoskan. Mehmet myy sellaisen, jos osaan tinkiä.", "Puhu Mehmetille ja valitse \"Tingitään ruoskasta!\". Vastaa piikkiin samalla mitalla."];
    return ["Kartan mukaan temppeli on idässä.", "Kävele kadun päähän moskeijan alle."];
  }
  if (here === "temppeli") {
    if (st.flags.idol) return ["Ulos ja äkkiä.", "Mene ovesta vasemmalle."];
    if (!has("sakki") && !f.swapped) return ["Idoli on ansoitettu. Tarvitsen jotain samanpainoista.", "Käytä kangaspussia hiekkaan."];
    if (!f.crossed) return ["Kuilun yli pääsee kahdella tavalla: ylhäältä tai tietämällä.", "Käytä ruoskaa katon koukkuun, tai vastaa tuomarille: 64 (kävele numeroille 6 ja 4)."];
    return ["Idoli kuilun takana. Vaihto sulavasti.", "Käytä hiekkasäkkiä idoliin."];
  }
  return null;
};
let hintLevel = {}, lastHint = "";
function hint() {
  if (busy || overlay || !room()) return;
  const h = HINTS(); if (!h) return;
  const key = h[1], lvl = lastHint === key ? Math.min(1, (hintLevel[key] ?? 0) + 1) : 0;
  hintLevel[key] = lvl; lastHint = key;
  script(() => say(h[lvl]));
}
