# Snowflake App Runtime: Liiga Ennuste -sovellus (Next.js), LIIGA.APP (6.11.: oma skeema,
# omistaja LIIGA_APP -- kapea ajorooli, snowflake/_account/roles/LIIGA_APP.sql; ennen LIIGA.CODE).
# Korvaa Streamlitin (streamlit_app/) osio kerrallaan; prototyyppi 16.10.2026.
#
# Sama polku kuin agentilla (CLAUDE.md, "Agentin julkaisuputki"):
#   oma kone:  snow app deploy --target dev                    # LIIGA_ENNUSTE_DEV, oma repo
#   CI-ehdokas: snow app deploy --target staging               # käännös + LIIGA_ENNUSTE_STAGING
#   tuotanto:  snow app deploy --target prod --promote-only    # SAMA käännös, ei uutta buildia
# staging ja prod jakavat artifact repositoryn, joten tuotantoon menee täsmälleen
# ehdokkaana tarkistettu versio. dev:llä on oma repo, joten paikallinen kokeilu ei
# voi päätyä tuotantoon.
version: 2

name: LIIGA_ENNUSTE
database: LIIGA
schema: APP
query_warehouse: LIIGA_WH

default_target: dev
artifact_repo: LIIGA.APP.LIIGA_ENNUSTE_REPO
package_name: liiga_ennuste
targets:
  dev:
    name: LIIGA_ENNUSTE_DEV
    artifact_repo: LIIGA.APP.LIIGA_ENNUSTE_DEV_REPO
  staging:
    name: LIIGA_ENNUSTE_STAGING
  prod:
    name: LIIGA_ENNUSTE

label: Liiga Ennuste
description: Liigapörssi 2026-27 -- sarjataulukko, vire ja mallin ennuste (LIIGA.MODEL).

ignore:
  - node_modules
  - .next
  - .env*
  - .git

install:
  commands:
    - [npm, ci]
build:
  commands:
    - [npm, run, build]
run:
  command: [node, .next/standalone/server.js]

# Ei jää päälle: sammuu käyttämättömänä, herää seuraavasta pyynnöstä. Yksi
# instanssi riittää demolle.
# 1800 s (6.11.2026, ennen 300 = pienin sallittu): laskentapoolin kylmäkäynnistys
# kestää jopa ~8,5 min, ja 5 min raja sammutti palvelun ennen kuin se ehti
# palvella ensimmäistäkään pyyntöä (käyttäjä: "sammutamme applikaation ennen kuin
# se ehtii käynnistyä"). Heräämisen aikana tullut pyyntö saa heti 503:n
# (serviceStatus=PENDING) eikä jää odottamaan -- sivu ladataan uudelleen.
auto_suspend_secs: 1800
auto_resume: true
min_instances: 1
max_instances: 1

# HOSTNAME on alustan varaama (094516), eikä sitä saa asettaa.
environment_variables:
  - name: LIIGA_WAREHOUSE
    value: "LIIGA_WH"
